  preferred_reason: "The paper prints two different spins. The Table 3 value is preferred because it equals the exact solution of the RPM equations for the central frequencies of Table 2 (a = 0.2861 with the formulas of Ingram & Motta 2014, reproduced by BlackPy), whereas the value in the text (0.290) does not solve them. Ingram & Motta (2014, Table 1) quote 0.285 +- 0.003 and Stuchlik & Kolos (2016) 0.286 +- 0.004 for the same triplet."
  other_values:
    - value: 0.290
      err_minus: 0.003
      err_plus: 0.003
      location: "Abstract, Sec. 4.1 ('a = 0.290 +- 0.003'), caption of Fig. 3 and Sec. 5"
      note: "Value quoted in the text; it differs from Table 3 of the same paper by more than its uncertainty and cannot be a rounding of 0.286."
