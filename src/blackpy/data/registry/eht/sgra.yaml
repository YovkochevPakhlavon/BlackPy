    citation: "Vagnozzi, Roy, Tsai, Visinelli, et al. (2023), Class. Quantum Grav. 40, 165007"
    doi: "10.1088/1361-6382/acd97b"
    arxiv: "2205.07787"
    role: "shadow-radius bounds"
  eht2022vi:
    citation: "Event Horizon Telescope Collaboration (2022), Astrophys. J. Lett. 930, L17 (Sgr A* Paper VI)"
    doi: "10.3847/2041-8213/ac6756"
    arxiv: "2311.09484"
    role: "fractional deviations per mass prior, angular gravitational radii"
  do2019:
    citation: "Do, Hees, Ghez, et al. (2019), Science 365, 664"
    doi: "10.1126/science.aav8137"
    arxiv: "1907.10731"
    role: "Keck mass and distance"
  gravity2022:
    citation: "GRAVITY Collaboration (2022), Astron. Astrophys. 657, L12"
    doi: "10.1051/0004-6361/202142465"
    arxiv: "2112.07478"
    role: "VLTI mass and distance"
  gravity2020:
    citation: "GRAVITY Collaboration (2020), Astron. Astrophys. 636, L5"
    doi: "10.1051/0004-6361/202037813"
    arxiv: "2004.07187"
    role: "earlier VLTI mass and distance (the paper cited by Vagnozzi et al.)"
source_access: "full text read from the ar5iv HTML rendering of the arXiv version (ar5iv.labs.arxiv.org), title/DOI checked against the arXiv API, accessed 2026-11-14 by Claude; the journal version was not compared. Mass priors, distance and per-prior deviations (dataset version 2): do2019, gravity2020, gravity2022, eht2022vi and vagnozzi2023 read from their ar5iv HTML renderings on 2026-11-16 by Claude; bibliographic data of do2019, gravity2020, gravity2022 and eht2022vi confirmed with Crossref on 2026-11-16; the journal versions were not compared"
notes: >
  The arXiv text gives 4.55 <~ r_sh/M <~ 5.22 (1 sigma, Eq. 7) and 4.21 <~ r_sh/M <~ 5.56
  (2 sigma, Eq. 8). These differ in the last digit of the lower limits from the values
  4.54 and 4.20 that are sometimes quoted (and that appeared in the BlackPy task
  description). They are consistent with Eq. (6) of the paper: 3 sqrt(3) (1 - 0.125) =
  4.547 and 3 sqrt(3) (1 - 0.19) = 4.209. The Gaussian likelihood uses Eq. (5).
bibliography_check: "Journal volume and page numbers of all references were checked against Crossref (api.crossref.org) on 2026-11-14."
open_questions:
  - "Which Keck numbers are right? Do et al. (2019), as read from ar5iv, give M = 3.964 x 1e6 Msun and R_0 = 7946 pc for the fit that assumes general relativity, whereas EHT Sgr A* Paper VI (Sec. 2.1) quotes 3.951 x 1e6 Msun and 7935 pc for it, and Vagnozzi et al. (2023, Table 1) print 3.951 and 7.953 kpc. The differences (0.3% in mass) are far below the 6.5% uncertainty of the shadow bound, so the default likelihood is unaffected."
todo:
