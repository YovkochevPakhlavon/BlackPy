source_access: "eht2019i and eht2019vi: text extracted from the arXiv PDFs (arxiv.org/pdf/1906.11238 and 1906.11243; no ar5iv rendering exists); all other references: ar5iv HTML renderings of the arXiv versions (ar5iv.labs.arxiv.org). Read by Claude on 2026-11-16. Checked by the owner on 2026-11-19: eht2019i against the journal version (ApJL 875, L1, Table 1; the M87* masses of dataset version 2 are taken from it), every other value against the arXiv versions. Titles, journals, volumes and article numbers of all references were confirmed with Crossref (api.crossref.org) on 2026-11-16."
notes: >
  Three caveats that a fit with this dataset inherits. (i) The measured quantity is the
  emission-ring diameter; the step to theta_g uses GRMHD simulations in the Kerr metric,
  so the bound is not model independent. (ii) delta compares mass-to-distance ratios; its
  use as a bound on the shadow radius follows Psaltis et al. (2020) and Kocherlakota et
  al. (2021). (iii) The result depends entirely on the mass prior: stellar dynamics gives
  delta = -0.01 +- 0.17, gas dynamics delta = 0.78 +- 0.3. In the PDF text extraction the
  asymmetric uncertainties of Tables 7 and 9 appear as 'value minus plus' (e.g. '3.62 0.34
  0.60'); the order was fixed by comparison with Table 1 of Paper I, where M(stars) is
  typeset as 6.2 (+1.1, -0.6).
