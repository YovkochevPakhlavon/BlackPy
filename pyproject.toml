[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackpy-gr"
dynamic = ["version"]
description = "Black hole metric in, observables and Bayesian parameter constraints out."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pahlavon Yovqochev" }]
keywords = ["general relativity", "black holes", "QPO", "black hole shadow", "Bayesian inference", "JAX"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "corner>=2.2",
    "pyyaml>=6.0",
    "emcee>=3.1",
    "dynesty>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist>=3.5", "ruff>=0.4", "build>=1.2", "twine>=5.1"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Repository = "https://github.com/YovkochevPakhlavon/BlackPy"
Documentation = "https://yovkochevpakhlavon.github.io/BlackPy/"
Changelog = "https://github.com/YovkochevPakhlavon/BlackPy/blob/main/CHANGELOG.md"
Issues = "https://github.com/YovkochevPakhlavon/BlackPy/issues"

[tool.hatch.version]
path = "src/blackpy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blackpy"]
exclude = ["**/.DS_Store", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
exclude = ["/site", "/build", "/dist", "/.github", "**/.DS_Store", "/BLACKPY_*_PROMPT.md", "/examples/output"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (sampler runs, benchmarks, symbolic 4D tensors, tests that compile many metric/observable combinations)"]
filterwarnings = ["ignore::DeprecationWarning:jax.*", "ignore::DeprecationWarning:dynesty.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
