[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackpy-gr"
dynamic = ["version"]
description = "Black hole metric in, observables and Bayesian parameter constraints out."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pahlavon Yovqochev" }]
keywords = ["general relativity", "black holes", "QPO", "black hole shadow", "Bayesian inference", "JAX"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "corner>=2.2",
    "pyyaml>=6.0",
    "emcee>=3.1",
    "dynesty>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Repository = "https://github.com/YovkochevPakhlavon/BlackPy"

[tool.hatch.version]
path = "src/blackpy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blackpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (performance benchmarks, sampler runs)"]
filterwarnings = ["ignore::DeprecationWarning:jax.*", "ignore::DeprecationWarning:dynesty.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
