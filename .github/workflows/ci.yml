name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ruff
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  # Quick subset (everything not marked "slow") on the three operating systems.
  quick:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Quick tests
        run: python -m pytest -m "not slow" -n auto --dist loadfile -q --durations=10

  # Full suite, including the slow tests (sampler runs, symbolic 4D tensors), on Linux only.
  full:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Full tests
        run: python -m pytest -n auto --dist loadfile -q --durations=20

  docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict

  # Build the sdist and the wheel, install the wheel (not editable) in a clean
  # environment and run the quick subset against the installed package.
  wheel:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check the wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "blackpy/py.typed" in names, "py.typed missing"
          assert sum(n.startswith("blackpy/data/registry/") and n.endswith(".yaml") for n in names) >= 8
          bad = [n for n in names if n.startswith(("tests/", "examples/", "site/")) or ".DS_Store" in n]
          assert not bad, bad
          PY
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl pytest pytest-xdist
      - name: Quick tests against the installed package
        run: |
          /tmp/wheel-env/bin/python -c "import blackpy, sys; assert 'site-packages' in blackpy.__file__, blackpy.__file__; print(blackpy.__file__)"
          /tmp/wheel-env/bin/python -m pytest -m "not slow" -n auto --dist loadfile -q

  # The oldest supported Python with the declared minimum dependency versions
  # (lower bounds in pyproject.toml; see DESIGN_NOTES.md, decision 42).
  min-deps:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the minimum versions
        run: |
          python -m pip install -r .github/min-requirements.txt pytest pytest-xdist
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip list
      - name: Quick tests
        run: python -m pytest -m "not slow" -n auto --dist loadfile -q
