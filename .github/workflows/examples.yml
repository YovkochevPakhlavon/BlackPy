name: Examples

# Every script in examples/ in quick mode (BLACKPY_EXAMPLES_QUICK=1: smaller sampler
# settings, about a minute per example). Weekly and on demand, not on every push.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  BLACKPY_EXAMPLES_QUICK: "1"

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Run every example
        run: |
          set -e
          for f in examples/[0-9]*.py; do
            echo "::group::$f"
            start=$(date +%s)
            python "$f"
            echo "$f took $(( $(date +%s) - start )) s"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: example-figures
          path: examples/output/
